<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui">
  <title>Scattergories Generator Rehashed</title>
  <link rel="icon" type="image/png" href="./dist/rehashed.png">
  <meta name="theme-color" content="#c5e0fc">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./dist/icon-192.png">
  <link rel="stylesheet" href="./dist/style.css">
</head>
<body>

<div class="svg-sprite">
  <svg width="1024" height="536" viewBox="0 0 1024 536" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <svg width="512" height="512" viewBox="0 0 512 512" id="pause" xmlns="http://www.w3.org/2000/svg"><path d="M224 435.8V76.1c0-6.7-5.4-12.1-12.2-12.1h-71.6c-6.8 0-12.2 5.4-12.2 12.1v359.7c0 6.7 5.4 12.2 12.2 12.2h71.6c6.8 0 12.2-5.4 12.2-12.2zM371.8 64h-71.6c-6.7 0-12.2 5.4-12.2 12.1v359.7c0 6.7 5.4 12.2 12.2 12.2h71.6c6.7 0 12.2-5.4 12.2-12.2V76.1c0-6.7-5.4-12.1-12.2-12.1z"/></svg>
    <svg width="512" height="512" viewBox="0 0 512 512" id="play" x="512" xmlns="http://www.w3.org/2000/svg"><path d="M405.2 232.9L126.8 67.2c-3.4-2-6.9-3.2-10.9-3.2-10.9 0-19.8 9-19.8 20H96v344h.1c0 11 8.9 20 19.8 20 4.1 0 7.5-1.4 11.2-3.4l278.1-165.5c6.6-5.5 10.8-13.8 10.8-23.1s-4.2-17.5-10.8-23.1z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cfeather cfeather-refresh-cw" id="refresh-cw" y="512" xmlns="http://www.w3.org/2000/svg"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
  </svg>
</div>

<div id="view">

  <div class="bottom-links s6">
    <h1 class="bottom-link clickable"><a href="./"><b>Scattergories Rehashed</b></a></h1>
    <button type="button" class="bottom-link fullscreen-button clickable" v-if="fullscreenSupported"
            :aria-pressed="isFullscreen ? 'true' : 'false'" @click="toggleFullscreen()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true">
        <path v-if="!isFullscreen" d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>
        <path v-else d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/>
      </svg>
      {{ isFullscreen ? 'Exit Fullscreen' : 'Fullscreen' }}
    </button>
  </div>

  <div class="frame">
    <div class="game-wrap" :class="gameState">
      <div class="animation-overlay"></div>
      <div class="game">
        <div class="left-wrap">

          <div class="letter-wrap">
            <div class="label">Letter</div>
            <div class="label-right" v-if="gameState !== GAME.IN_GAME"><button @click="rollLetter()">Re-roll</button></div>
            <div class="letter s4">
              <input class="letter-input" type="text" maxlength="2" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
                     :value="currentLetter" :readonly="!canEdit" :tabindex="canEdit ? 0 : -1"
                     :title="canEdit ? 'Click and type to choose the letter' : ''" aria-label="Letter"
                     @input="onLetterInput($event)" @focus="$event.target.select()" @keydown.enter="$event.target.blur()">
            </div>
          </div>

          <div class="game-info-wrap">
            <div class="time-wrap">
              <div class="label">Time</div>
              <div class="label-right"><button @click="editTime()">Change</button></div>
              <div class="time" role="timer" aria-live="off"><span class="time-char" v-for="(c, i) in timeText" :key="i" :class="c === ':' ? 'colon' : 'digit'">{{ c }}</span></div>
            </div>

            <div class="controls-wrap">
              <div class="label"><div class="label-inner">{{ playLabel }}</div></div>
              <div class="controls">
                <button v-if="gameState !== GAME.GAME_OVER" name="button" @click="(gameState === GAME.IN_GAME ? pauseGame: startGame)()">
                  <div class="button-outer animate-svg-path">
                    <svg width="32px" height="32px" viewBox="6 6 24 24"><path d="M11,10 L18,13.74 18,22.28 11,26 M18,13.74 L26,18 26,18 18,22.28"/></svg>
                  </div>
                </button>
                <button v-if="gameState === GAME.GAME_OVER" name="button" @click="resetGame()" class="button-play-again">
                  <svg viewbox="0 512 24 24">&nbsp;<use xlink:href="#refresh-cw"/>&nbsp;</svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="words">
          <div class="label categories-main-label">
            Categories
            <select class="topic-select" aria-label="Topic" :value="topic" :disabled="!canEdit"
                    :title="canEdit ? 'Choose a topic' : 'Restart to change topic'"
                    @change="setTopic($event.target.value)">
              <option v-for="t in topics" :value="t.id">{{ t.label }}</option>
            </select>
          </div>
          <div class="label-right"><button @click="changeCategoryCount(-1)">-</button> {{ categoryCount }} <button @click="changeCategoryCount(1)">+</button></div>

          <div class="words-wrap">
            <div class="words-scroller">
              <div class="word-wrap" v-for="(word, index) in currentWords">
                <div class="number">{{ index + 1 }}</div>
                <div class="word s6" :style="{'transition-delay': index * 30 + 'ms' }"><span>{{ word }}</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="button-wrap">
        <button @click="resetGame()" class="reset-button clickable">
          <div class="reset-button-inner">
            <div class="refresh-icon-wrap"><svg viewbox="0 512 24 24">&nbsp;<use xlink:href="#refresh-cw"/>&nbsp;</svg></div>
            <div class="animated-letters">
              <div class="animated-letter">R</div><div class="animated-letter">e</div><div class="animated-letter">s</div><div class="animated-letter">t</div><div class="animated-letter">a</div><div class="animated-letter">r</div><div class="animated-letter">t</div>
            </div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <transition name="time-modal">
    <div class="time-modal-backdrop" v-if="state.editingTime" @mousedown.self="closeTimeEditor()">
      <div class="time-modal" role="dialog" aria-modal="true" aria-labelledby="time-modal-title">
        <div class="time-modal-title" id="time-modal-title">Set Time</div>
        <form method="POST" @submit.prevent="submitUpdateTime()">
          <div class="time-fields">
            <label class="time-field-label" for="time-input-min">Minutes</label>
            <span></span>
            <label class="time-field-label" for="time-input-sec">Seconds</label>

            <button type="button" class="time-step" aria-label="Add a minute" @click="stepTime(60)">+</button>
            <span></span>
            <button type="button" class="time-step" aria-label="Add a second" @click="stepTime(1)">+</button>

            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" id="time-input-min" aria-label="Minutes"
                   :value="editMinutes" @input="onTimeField($event, 'editMinutes')" @focus="$event.target.select()" @change="setEditTotal(editTotal)"
                   @keydown.up.prevent="stepTime(60)" @keydown.down.prevent="stepTime(-60)">
            <span class="time-sep">:</span>
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" id="time-input-sec" aria-label="Seconds"
                   :value="editSeconds" @input="onTimeField($event, 'editSeconds')" @focus="$event.target.select()" @change="setEditTotal(editTotal)"
                   @keydown.up.prevent="stepTime(1)" @keydown.down.prevent="stepTime(-1)">

            <button type="button" class="time-step" aria-label="Subtract a minute" @click="stepTime(-60)">&minus;</button>
            <span></span>
            <button type="button" class="time-step" aria-label="Subtract a second" @click="stepTime(-1)">&minus;</button>
          </div>
          <div class="time-modal-actions">
            <button type="button" class="time-modal-cancel" @click="closeTimeEditor()">Cancel</button>
            <button type="submit" class="time-modal-confirm" :disabled="editTotal < 1">Set Time</button>
          </div>
        </form>
      </div>
    </div>
  </transition>

  <transition name="time-modal">
    <div class="time-modal-backdrop" v-if="state.timeUp" @mousedown.self="closeTimeUp()">
      <div class="time-modal time-up-modal" role="alertdialog" aria-modal="true" aria-describedby="time-up-text">
        <div class="time-up-text" id="time-up-text">Times up!</div>
        <div class="time-modal-actions">
          <button type="button" class="time-modal-cancel" @click="closeTimeUp()">Close</button>
          <button type="button" class="time-modal-confirm" id="time-up-confirm" @click="restartFromTimeUp()">New Round</button>
        </div>
      </div>
    </div>
  </transition>
</div>

<script src="./dist/vendor/vue.min.js"></script>
<script src="./dist/vendor/anime.min.js"></script>
<script src="./dist/categories.js"></script>
<script src="./dist/app.js"></script>
</body>
</html>
